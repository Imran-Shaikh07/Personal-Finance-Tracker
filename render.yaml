services:
  - type: web
    name: imran-personal-finance-tracker-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        value: https://imran-personal-finance-tracker.onrender.com

  - type: web
    name: imran-personal-finance-tracker
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://imran-personal-finance-tracker-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
